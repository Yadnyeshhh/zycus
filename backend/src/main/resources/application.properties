spring.application.name=stockpulse

# H2 Database configuration
spring.datasource.url=jdbc:h2:mem:stockpulse
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# SQL logging
spring.jpa.show-sql=true

# Server port
server.port=8080

# LLM Gateway Configuration
llm.provider=${LLM_PROVIDER:gemini}
llm.api-key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:gemini-1.5-flash}
llm.base-url=${LLM_BASE_URL:https://generativelanguage.googleapis.com}